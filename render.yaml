services:
  - type: web
    name: olympos
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OLYMPOS_ENV
        value: production
      - key: OLYMPOS_CORS_ORIGINS
        value: "*"
      - key: OLYMPOS_DB_PATH
        value: /data/olympos_phase0.db
      - key: PORTRAIT_PROVIDER
        value: mock
    disk:
      name: olympos-data
      mountPath: /data
      sizeGB: 1
